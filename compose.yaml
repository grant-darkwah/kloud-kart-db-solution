services:
  postgres-prod:
    image: postgres:18
    container_name: kloudkart-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROD_DB_NAME}
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kloudkart_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d ${PROD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:18
    container_name: kloudkart-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME}
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kloudkart_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER} -d ${TEST_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kloudkart_prod_data:
  kloudkart_test_data: